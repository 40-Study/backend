# Gửi thông báo Discord khi có code vào main và khi CI trên main chạy xong.
# Cần secret DISCORD_WEBHOOK_URL (Discord > Channel Settings > Integrations > Webhooks),
# thêm "?thread_id=<id>" vào cuối URL để gửi vào một thread.
# Payload dựng bằng jq đọc thẳng file event / JSON từ API, không nhúng ${{ }} vào shell để tránh
# injection qua commit message, tiêu đề PR hay tên nhánh.
name: Discord Notify

on:
  push:
    branches: [ main ]
  workflow_run:
    # Tên workflow CI cần báo kết quả (khớp field `name:` của workflow đó)
    workflows: [ "Backend CI" ]
    types: [ completed ]
    branches: [ main ]

# Chỉ đọc: tra PR gắn với commit (tiêu đề, mô tả, review, commit của PR)
permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Chỉ báo build chạy từ push vào main (bỏ qua build của PR) và bỏ run bị skip
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'skipped')
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Build payload
        shell: bash
        run: |
          set -euo pipefail
          # Hàm jq dùng chung: cắt chuỗi theo giới hạn ký tự của Discord embed
          JQ_LIB='def trunc(n): if length > n then .[0:n-1] + "…" else . end;'

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$(jq '.commits | length' "$GITHUB_EVENT_PATH")" -eq 0 ]; then
              echo "Push không có commit mới, bỏ qua."; exit 0
            fi
            # Tra PR đã merge vào main chứa commit này (đúng cho cả merge commit, squash và rebase)
            sha=$(jq -r '.after' "$GITHUB_EVENT_PATH")
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty' || true)
            # API lỗi thì gh in thân lỗi ra stdout: không phải số => coi như push thẳng
            [[ "$pr" =~ ^[0-9]+$ ]] || pr=""

            if [ -n "$pr" ]; then
              gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > pr.json
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/commits" | jq -s 'add // []' > pr-commits.json
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews" | jq -s 'add // []' > pr-reviews.json
              jq -n --slurpfile pr pr.json --slurpfile commits pr-commits.json --slurpfile reviews pr-reviews.json "$JQ_LIB"'
                $pr[0] as $p | $commits[0] as $c | $reviews[0] as $rv
                | ([$rv[] | select(.state == "APPROVED") | .user.login] | unique) as $approved
                | ([$rv[] | .user.login | select(. != $p.user.login)] | unique) as $reviewers
                # Bỏ comment HTML của PR template và dòng trống thừa
                | (($p.body // "") | gsub("<!--[\\s\\S]*?-->"; "") | gsub("\r"; "") | gsub("\n{3,}"; "\n\n")
                   | sub("^\\s+"; "") | sub("\\s+$"; "") | trunc(1500)) as $body
                | ([ $c[-15:][] | "[`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0] | trunc(150))" ]
                   | join("\n")) as $clist
                | {
                    username: "40Study GitHub",
                    embeds: [{
                      title: ("🔀 [\($p.base.repo.name)] PR #\($p.number): \($p.title)" | trunc(256)),
                      url: $p.html_url,
                      color: 5793266,
                      author: { name: ($p.merged_by.login // $p.user.login),
                                icon_url: ($p.merged_by.avatar_url // $p.user.avatar_url),
                                url: ($p.merged_by.html_url // $p.user.html_url) },
                      description: ((if $body == "" then "_PR không có mô tả_" else $body end)
                        + "\n\n**Commit trong PR (\($c | length)):**\n" + $clist) | trunc(4000),
                      fields: ([
                        { name: "Nhánh", value: "`\($p.head.ref)` → `\($p.base.ref)`", inline: true },
                        { name: "Người tạo", value: $p.user.login, inline: true },
                        { name: "Người merge", value: ($p.merged_by.login // "?"), inline: true },
                        { name: "Review", inline: true, value: (if ($reviewers | length) == 0 then "Chưa có review"
                            else ($reviewers | map(if IN($approved[]) then "✅ \(.)" else . end) | join(", ") | trunc(1024)) end) }
                      ] + (if ($p.labels | length) > 0
                            then [{ name: "Label", value: ($p.labels | map(.name) | join(", ") | trunc(1024)), inline: true }]
                            else [] end)),
                      footer: { text: (if ($c | length) > 15 then "Hiển thị 15/\($c | length) commit gần nhất" else "merge vào main" end) },
                      timestamp: $p.merged_at
                    }]
                  }' > payload.json
            else
              # Push thẳng vào main, không qua PR: liệt kê tên từng commit
              jq "$JQ_LIB"'
                (.commits | length) as $n
                | {
                    username: "40Study GitHub",
                    embeds: [{
                      title: "📦 [\(.repository.name):main] \($n) commit push thẳng (không qua PR)",
                      url: .compare,
                      color: 16753920,
                      author: { name: .sender.login, icon_url: .sender.avatar_url, url: .sender.html_url },
                      description: ([ .commits[-15:][]
                        | "[`\(.id[0:7])`](\(.url)) **\(.message | split("\n")[0] | trunc(150))** - \(.author.username // .author.name)" ]
                        | join("\n") | trunc(4000)),
                      fields: [ { name: "Người push", value: .sender.login, inline: true } ],
                      footer: { text: (if $n > 15 then "Hiển thị 15/\($n) commit gần nhất" else "push vào main" end) },
                      timestamp: (now | todate)
                    }]
                  }' "$GITHUB_EVENT_PATH" > payload.json
            fi
          else
            jq '
              .workflow_run as $r
              | ({ success:   ["✅", "thành công", 3066993],
                   failure:   ["❌", "THẤT BẠI",   15158332],
                   cancelled: ["⚪", "bị huỷ",     9807270],
                   timed_out: ["⏱️", "quá thời gian", 15158332] }[$r.conclusion]
                 // ["⚠️", $r.conclusion, 16776960]) as $s
              | ((($r.updated_at | fromdate) - ($r.run_started_at | fromdate))) as $d
              | {
                  username: "40Study GitHub",
                  embeds: [{
                    title: "\($s[0]) [\(.repository.name):\($r.head_branch)] \($r.name) \($s[1])",
                    url: $r.html_url,
                    color: $s[2],
                    author: { name: $r.actor.login, icon_url: $r.actor.avatar_url, url: $r.actor.html_url },
                    description: "[`\($r.head_sha[0:7])`](\(.repository.html_url)/commit/\($r.head_sha)) \(($r.head_commit.message // "") | split("\n")[0])",
                    fields: [
                      { name: "Run", value: "#\($r.run_number)", inline: true },
                      { name: "Thời gian", value: "\($d / 60 | floor)m \($d % 60)s", inline: true }
                    ],
                    timestamp: $r.updated_at
                  }]
                }' "$GITHUB_EVENT_PATH" > payload.json
          fi
          cat payload.json

      - name: Send to Discord
        shell: bash
        run: |
          set -euo pipefail
          [ -f payload.json ] || exit 0
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::warning::Chưa cấu hình secret DISCORD_WEBHOOK_URL, không gửi thông báo."; exit 0
          fi
          curl -sS --fail-with-body -H "Content-Type: application/json" \
            -d @payload.json "$DISCORD_WEBHOOK_URL"
