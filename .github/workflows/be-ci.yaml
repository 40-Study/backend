name: Backend CI

on:
  push:
    branches: [ main, be ]
  pull_request:
    branches: [ main, be ]

jobs:
  go-backend:
    name: Build Go Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Test tích hợp chạy trên Postgres THẬT (khoá dòng, CHECK constraint, window function...).
    # CI=true: pgtest.Open/IsolatedSchema FAIL thay vì SKIP khi không kết nối được DB.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: study_ci
          POSTGRES_PASSWORD: study_ci_only
          POSTGRES_DB: study_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study_ci -d study_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      ENVIRONMENT: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: study_ci
      DB_PASSWORD: study_ci_only
      DB_NAME: study_test
      JWT_SECRET: ci-only-jwt-secret-not-used-outside-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      # Entrypoint là ./cmd/api (không có ./cmd/main.go — bước cũ fail từ 05/2026)
      - name: Build
        run: go build -v -o study-be ./cmd/api

      - name: Vet
        run: go vet ./...

      # Tạo schema public (AutoMigrate + roles/permissions) cho các test tích hợp tự ROLLBACK.
      # Test cần COMMIT dữ liệu tự tạo schema tạm riêng (pgtest.IsolatedSchema). .env rỗng vì
      # LoadConfig bắt buộc đọc được file cấu hình; giá trị thật lấy từ env của job.
      - name: Migrate test database
        run: |
          touch .env
          go run ./cmd/seed -mode=base

      - name: Test
        shell: bash
        run: |
          set +e
          go test -count=1 -v ./... > go-test.log 2>&1
          rc=$?
          grep -E '^(ok|FAIL|panic)|--- FAIL' go-test.log
          if [ "$rc" -ne 0 ]; then grep -B2 -A20 -- '--- FAIL' go-test.log | head -200; fi
          exit $rc

      # Bằng chứng test Postgres đã CHẠY thật: in kết quả các test tích hợp, và chặn mọi SKIP
      # (trong repo chỉ pgtest mới Skip, tức là lọt mất DB).
      - name: Postgres tests ran (no SKIP)
        shell: bash
        run: |
          grep -E -- '--- (PASS|FAIL|SKIP): Test(Withdrawal|RefundOrder_Waits|TeacherEarnings_Fee|BuildStatusCheckConstraintSQL_Postgres|CheckAndProcessPayment_Chot|ListByCourse_LocTheoSection|RevokeActiveAssignment|AdminListUsers_Keyword)' go-test.log
          if grep -q -- '--- SKIP' go-test.log; then echo "::error::Có test bị SKIP (mất kết nối Postgres?)"; exit 1; fi

  python-transaction-api:
    name: Build Python Transaction API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f transaction/requirements.txt ]; then pip install -r transaction/requirements.txt; fi

      - name: Lint check
        run: python -m py_compile transaction/api.py

  docker-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Transaction API Image
        run: docker build -t simple-mbbank-api -f transaction/dockerfile .
