name: Backend CI

on:
  push:
    branches: [ main, be ]
  pull_request:
    branches: [ main, be ]

jobs:
  go-backend:
    name: Build Go Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      # Entrypoint là ./cmd/api (không có ./cmd/main.go — bước cũ fail từ 05/2026)
      - name: Build
        run: go build -v -o study-be ./cmd/api

      - name: Vet
        run: go vet ./...

      # Test unit chạy trên DryRun/sqlmock, không cần Postgres
      - name: Test
        run: go test -count=1 ./...

  python-transaction-api:
    name: Build Python Transaction API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f transaction/requirements.txt ]; then pip install -r transaction/requirements.txt; fi

      - name: Lint check
        run: python -m py_compile transaction/api.py

  docker-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Transaction API Image
        run: docker build -t simple-mbbank-api -f transaction/dockerfile .
