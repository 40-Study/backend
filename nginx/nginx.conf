worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # Lệnh này cho phép Nginx đọc file mime.types để xác đinh contenttype
    # mime.types nằm trong thư mục /etc/nginx/ khi cài đặt Nginx, có thể tuỳ chỉnh nếu cần
    include /etc/nginx/mime.types;
    # mặc định nếu không tìm thấy content type trong file mime.types thì sẽ dùng application/octet-stream
    default_type application/octet-stream;

    # format log chi tiết hơn, bao gồm thời gian xử lý request (request_time) để monitor hiệu năng
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    # Ghi log ra file access.log với định dạng đã định nghĩa ở trên
    access_log /var/log/nginx/access.log main;

    # Cấu hình tối ưu hiệu năng cơ bản với các lệnh có tác dụng sau:
    # sendfile: cho phép Nginx sử dụng hệ thống file để gửi file tĩnh hiệu quả hơn
    sendfile on;
    # TCP optimizations: giảm độ trễ cho các kết nối lâu dài như WebSocket hoặc API
    tcp_nopush on;
    # tcp_nodelay: tắt Nagle's algorithm để giảm độ trễ cho các request nhỏ
    tcp_nodelay on;
    # keepalive_timeout: thiết lập thời gian giữ kết nối keep-alive lâu hơn để cải thiện hiệu năng cho các client có nhiều request liên tiếp
    keepalive_timeout 65;
    # types_hash_max_size: tăng kích thước hash table cho MIME types để cải thiện hiệu năng khi có nhiều loại file khác nhau
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript;

    # Rate limiting zones
    # api_limit    : giới hạn chung cho tất cả API để tránh bị quá tải bởi request tấn công hoặc lỗi client với limit 10mbs và 100 request/s
    # upload_limit : giới hạn chặt chẽ cho endpoint upload để tránh spam
    # conn_limit   : giới hạn số kết nối đồng thời theo IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    # upload_limit có rate thấp hơn vì upload thường tốn nhiều tài nguyên hơn và dễ bị lạm dụng để tấn công từ chối dịch vụ (DoS)
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/m;
    # conn_limit zone giới hạn số kết nối đồng thời từ cùng một IP để tránh tình trạng quá tải do nhiều kết nối từ một nguồn (ví dụ: tấn công DDoS hoặc lỗi client)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream servers (backend services) - using IPv4 address directly
    upstream frontend {
        server 192.168.65.254:3000;
        keepalive 32;
    }
    # Backend API server
    upstream backend {
        server 192.168.65.254:5000;
        keepalive 32;
    }

    upstream livekit {
        server 192.168.65.254:7880;
        keepalive 32;
    }

    upstream minio_api {
        server 192.168.65.254:9000;
        keepalive 32;
    }

    upstream minio_console {
        server 192.168.65.254:9090;
        keepalive 32;
    }

    upstream rabbitmq {
        server 192.168.65.254:15672;
        keepalive 32;
    }

    server {
        listen 80;
        server_name fortex.ai.vn;

        limit_rate 10m;
        limit_conn conn_limit 20;
        client_max_body_size 100M;

        location / {
            # Proxy den Next.js app
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Backend can sử dụng header này để xác thực request
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 86400;
        }
    }

    # ============ Backend API - api.fortex.ai.vn ============
    server {
        listen 80;
        server_name api.fortex.ai.vn;

        limit_conn conn_limit 50;

        # HLS Video Streaming - no buffering, no rate limit for smooth playback
        location ~ ^/api/hls/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # No buffering for streaming
            proxy_buffering off;
            proxy_cache off;

            # Longer timeouts for video
            proxy_read_timeout 600;
            proxy_send_timeout 600;

            # CORS headers for video player
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

            # Handle preflight
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Upload endpoints - cho phép upload file lớn (video, media) với các thiết lập tối ưu để tránh quá tải server và đảm bảo trải nghiệm người dùng tốt:
        location ~ ^/api/(upload|media|files)/ {
            # Giới hạn băng thông cho các endpoint này để tránh tình trạng người dùng upload file quá lớn hoặc quá nhiều
            # Bandwidth: 10MB/s
            limit_rate 10m;
            limit_req zone=upload_limit burst=10 nodelay;
            client_max_body_size 2G;
            client_body_buffer_size 10M;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Backend can sử dụng header này để xác thực request
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        location / {
            # Bandwidth: 10MB/s
            limit_rate 10m;
            limit_req zone=api_limit burst=200 nodelay;
            client_max_body_size 100M;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Backend can sử dụng header này để xác thực request
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
        }
    }

    server {
        listen 80;
        server_name livekit.fortex.ai.vn;

        # LiveKit server - chủ yếu xử lý WebSocket cho real-time communication (video/audio streaming, signaling, v.v.)
        # WebSocket thường yêu cầu giữ kết nối mở lâu dài, vì vậy chúng ta không giới hạn băng thông quá chặt để tránh ảnh hưởng đến chất lượng stream, nhưng vẫn giới hạn số kết nối đồng thời để tránh quá tải server.
        limit_conn conn_limit 100;

        location / {
            proxy_pass http://livekit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }

    server {
        listen 80;
        server_name cdn.fortex.ai.vn;

        # Download/upload media qua MinIO API
        # Bandwidth: 10MB/s for file downloads
        limit_rate 10m;
        limit_conn conn_limit 30;
        client_max_body_size 2G;

        location / {
            proxy_pass http://minio_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 600;
            proxy_send_timeout 600;
            # Tắt buffering để giảm độ trễ cho các request upload/download lớn, đặc biệt là khi client có kết nối chậm hoặc không ổn định. Điều này giúp cải thiện trải nghiệm người dùng khi tương tác với media qua MinIO.
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    server {
        listen 80;
        server_name minio.fortex.ai.vn;

        # MinIO console - giao diện quản lý MinIO, chủ yếu dành cho admin hoặc dev để quản lý bucket, file, v.v. Không cần giới hạn băng thông quá chặt vì đây không phải endpoint chính cho người dùng cuối, nhưng vẫn giới hạn số kết nối đồng thời để tránh tình trạng quá tải nếu có nhiều người truy cập cùng lúc.
        limit_rate 10m;
        limit_conn conn_limit 10;

        location / {
            proxy_pass http://minio_console;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 80;
        server_name mq.fortex.ai.vn;

        # RabbitMQ management interface - chủ yếu dành cho admin để giám sát và quản lý RabbitMQ. Tương tự như MinIO console, không cần giới hạn băng thông quá chặt nhưng vẫn giới hạn số kết nối đồng thời để tránh tình trạng quá tải nếu có nhiều người truy cập cùng lúc.
        limit_rate 5m;
        limit_conn conn_limit 10;

        location / {
            proxy_pass http://rabbitmq;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 80 default_server;
        server_name _;
        # Bắt tất cả request không khớp với server_name nào ở trên và trả về lỗi 444 (No Response) để giảm thiểu rủi ro từ các request không hợp lệ hoặc tấn công từ chối dịch vụ (DoS) nhắm vào server.
        return 444;
    }
}
