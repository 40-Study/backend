x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M
      max-file: "5"

services:
  mbbank-api:
    build:
      context: .
      dockerfile: transaction/dockerfile
    container_name: mbbank-transaction-api
    ports:
      - "${MBBANK_REST_HOST_PORT:?set MBBANK_REST_HOST_PORT in .env}:8000"   # REST API
      - "127.0.0.1:${MBBANK_GRPC_HOST_PORT:?set MBBANK_GRPC_HOST_PORT in .env}:50051" # gRPC
    environment:
      - MB_USERNAME=${MB_USERNAME}
      - MB_PASSWORD=${MB_PASSWORD}
      - MB_ACCOUNT_NO=${MB_ACCOUNT_NO}
      - TRANSACTION_SERVICE_TOKEN=${TRANSACTION_SERVICE_TOKEN:?TRANSACTION_SERVICE_TOKEN is required}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://host.docker.internal:3000/api/v1/payment/webhook}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-your-webhook-secret}
      - POLL_INTERVAL=${POLL_INTERVAL:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Để container gọi được localhost của host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"] # REST /health + cổng gRPC (image slim không có curl)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Test service
  test:
    image: curlimages/curl:latest
    depends_on:
      - mbbank-api
    command: >
      sh -c "
        echo 'Waiting for API...';
        sleep 10;
        echo '\n=== Testing API ===';
        echo '\n1. Health Check:';
        curl -s http://mbbank-api:8000/health | python -m json.tool || echo 'Failed';
        echo '\n\n2. API Documentation:';
        echo 'Swagger UI: http://localhost:8000/docs';
        echo 'ReDoc: http://localhost:8000/redoc';
      "
    profiles:
      - test

  judge_server:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    user: root
    volumes:
      - ./judge/judge0.conf:/judge0.conf:ro
      - ./judge/init-cgroups.sh:/init-cgroups.sh:ro
    # Execute with Bash instead of using the bind-mounted file's shebang. On
    # macOS Docker mounts this file is not directly executable inside Linux.
    entrypoint: ["/bin/bash", "-c", "bash /init-cgroups.sh ./scripts/server"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: judge0_db
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${JUDGE0_HOST_PORT:?set JUDGE0_HOST_PORT in .env}:2358"
    privileged: true

    restart: always
    depends_on:
      - postgres
      - redis
    networks:
      - study_network

  judge_worker:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    user: root
    volumes:
      - ./judge/judge0.conf:/judge0.conf:ro
      - ./judge/init-cgroups.sh:/init-cgroups.sh:ro
    entrypoint: ["/bin/bash", "-c", "bash /init-cgroups.sh ./scripts/workers"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: judge0_db
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    privileged: true

    restart: always
    depends_on:
      - judge_server
    networks:
      - study_network
      
  rabbitmq:
    image: rabbitmq:3-management
    container_name: study_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_HOST_PORT:?set RABBITMQ_HOST_PORT in .env}:5672" # RabbitMQ main port
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:?set RABBITMQ_MANAGEMENT_HOST_PORT in .env}:15672" # Management UI
    networks:
      - study_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: study_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_HOST_PORT:?set POSTGRES_HOST_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - study_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: study_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_HOST_PORT:?set REDIS_HOST_PORT in .env}:6379"
    volumes:
      - redis_data:/data
    networks:
      - study_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: study-minio-community:2025-09-07
    build:
      context: ./.gotmp
      dockerfile: Minio.Dockerfile
    container_name: study_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "${MINIO_API_HOST_PORT:?set MINIO_API_HOST_PORT in .env}:9000" # API Port
      - "${MINIO_CONSOLE_HOST_PORT:?set MINIO_CONSOLE_HOST_PORT in .env}:9001"
    volumes:
      - minio_data:/data
    networks:
      - study_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio_createbuckets:
    image: quay.io/minio/aistor/mc:RELEASE.2025-08-21T03-14-05Z
    container_name: study_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio/cors.json:/cors.json:ro
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      sleep 10;
      echo 'Configuring MinIO...';
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      echo 'Creating buckets...';
      /usr/bin/mc mb myminio/study-media --ignore-existing;
      /usr/bin/mc mb myminio/study-avatars --ignore-existing;
      /usr/bin/mc mb myminio/study-documents --ignore-existing;
      /usr/bin/mc mb myminio/study-assignments --ignore-existing;
      echo 'Setting bucket policies...';
      /usr/bin/mc anonymous set download myminio/study-media;
      /usr/bin/mc anonymous set download myminio/study-avatars;
      /usr/bin/mc anonymous set download myminio/study-documents;
      echo 'MinIO setup completed successfully!';
      exit 0;
      "
    networks:
      - study_network

  livekit:
    image: livekit/livekit-server:latest
    environment:
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:?LIVEKIT_NODE_IP must be set}
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          udp_port: 7882
          tcp_port: 7881
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
        keys:
          ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
        logging:
          level: info
    ports:
      - "${LIVEKIT_HTTP_HOST_PORT:?set LIVEKIT_HTTP_HOST_PORT in .env}:7880"
      - "${LIVEKIT_RTC_TCP_HOST_PORT:?set LIVEKIT_RTC_TCP_HOST_PORT in .env}:7881"
      - "${LIVEKIT_RTC_UDP_HOST_PORT:?set LIVEKIT_RTC_UDP_HOST_PORT in .env}:7882/udp"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - study_network

  livekit_egress:
    image: livekit/egress:latest
    privileged: true
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
      EGRESS_CONFIG_BODY: |
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
        s3:
          access_key: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
          secret: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
          region: ap-southeast-1
          bucket: recordings
          endpoint: http://minio:9000
          force_path_style: true

    depends_on:
      - livekit
      - redis
      - minio
    restart: unless-stopped
    networks:
      - study_network

  study_nginx:
    image: nginx:alpine
    container_name: study_nginx
    restart: unless-stopped
    ports:
      - "${STUDY_NGINX_HOST_PORT:?set STUDY_NGINX_HOST_PORT in .env}:80"
    environment:
      API_BACKEND_PORT: ${PORT}
      LIVEKIT_HTTP_HOST_PORT: ${LIVEKIT_HTTP_HOST_PORT}
      MINIO_API_HOST_PORT: ${MINIO_API_HOST_PORT}
      MINIO_CONSOLE_HOST_PORT: ${MINIO_CONSOLE_HOST_PORT}
      RABBITMQ_MANAGEMENT_HOST_PORT: ${RABBITMQ_MANAGEMENT_HOST_PORT}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: '^(API_BACKEND_PORT|LIVEKIT_HTTP_HOST_PORT|MINIO_API_HOST_PORT|MINIO_CONSOLE_HOST_PORT|RABBITMQ_MANAGEMENT_HOST_PORT)$'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - livekit
    networks:
      - study_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
