  #     TRANSACTION_SERVICE_HOST: mbbank-api
  #     LIVEKIT_NODE_IP: livekit
  #     LIVEKIT_URL: ws://livekit:7880
  #   networks:
  #     - study_network
networks:
  study_network:
    driver: bridge

volumes:
  postgres_data:
    name: study_postgres_data
  redis_data:
    name: study_redis_data
  minio_data:
    name: study_minio_data
