x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M
      max-file: "5"

services:
  mbbank-api:
    build:
      context: .
      dockerfile: transaction/dockerfile
    container_name: mbbank-transaction-api
    ports:
      - "8000:8000"
    environment:
      - MB_USERNAME=${MB_USERNAME}
      - MB_PASSWORD=${MB_PASSWORD}
      - MB_ACCOUNT_NO=${MB_ACCOUNT_NO}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://host.docker.internal:3000/api/v1/payment/webhook}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-your-webhook-secret}
      - POLL_INTERVAL=${POLL_INTERVAL:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Để container gọi được localhost của host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Test service
  test:
    image: curlimages/curl:latest
    depends_on:
      - mbbank-api
    command: >
      sh -c "
        echo 'Waiting for API...';
        sleep 10;
        echo '\n=== Testing API ===';
        echo '\n1. Health Check:';
        curl -s http://mbbank-api:8000/health | python -m json.tool || echo 'Failed';
        echo '\n\n2. API Documentation:';
        echo 'Swagger UI: http://localhost:8000/docs';
        echo 'ReDoc: http://localhost:8000/redoc';
      "
    profiles:
      - test

  judge_server:
    image: judge0/judge0:latest
    platform: linux/amd64
    volumes:
      - ./judge/judge0.conf:/judge0.conf:ro
      - ./judge/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["./scripts/server"]
    ports:
      - "2358:2358"
    privileged: true
    environment:
      - CGO_ENABLED=0

    mem_limit: 1g              # server không cần nhiều RAM
    pids_limit: 2048

    ulimits:
      stack: 1048576           # 1MB stack thay vì 8MB mặc định
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

    restart: always
    depends_on:
      - postgres
      - redis
    networks:
      - study_network


  judge_worker:
    image: judge0/judge0:latest
    platform: linux/amd64
    volumes:
      - ./judge/judge0.conf:/judge0.conf:ro
      - ./judge/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["./scripts/workers"]
    privileged: true

    mem_limit: 3g              # phần RAM chính cho compile
    pids_limit: 2048

    environment:
      - CGO_ENABLED=0
      - GOMAXPROCS=2           # hạn chế Go spawn quá nhiều OS thread

    ulimits:
      stack: 1048576           # cực kỳ quan trọng để tránh pthread fail
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

    restart: always
    depends_on:
      - judge_server
    networks:
      - study_network
      
  rabbitmq:
    image: rabbitmq:3-management
    container_name: study_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672" # RabbitMQ main port
      - "15672:15672" # Management UI
    networks:
      - study_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: study_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - study_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: study_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - study_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    container_name: study_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # API Port
      - "9090:9001"
    volumes:
      - minio_data:/data
    networks:
      - study_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio_createbuckets:
    image: minio/mc:latest
    container_name: study_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      sleep 10;
      echo 'Configuring MinIO...';
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      echo 'Creating buckets...';
      /usr/bin/mc mb myminio/study-media --ignore-existing;
      /usr/bin/mc mb myminio/study-avatars --ignore-existing;
      /usr/bin/mc mb myminio/study-documents --ignore-existing;
      /usr/bin/mc mb myminio/study-assignments --ignore-existing;
      echo 'MinIO setup completed successfully!';
      exit 0;
      "
    networks:
      - study_network

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yml
    volumes:
      - ./livekit/livekit.yml:/etc/livekit.yml:ro
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - study_network

networks:
  study_network:
    driver: bridge

volumes:
  postgres_data:
    name: study_postgres_data
  redis_data:
    name: study_redis_data
  minio_data:
    name: study_minio_data
