################################################################################
# Judge0 Configuration - Optimized for 2GB RAM (Study Server)
################################################################################

############################
# Server Core
############################

JUDGE0_TELEMETRY_ENABLE=false
RESTART_MAX_TRIES=10

MAINTENANCE_MODE=false

ENABLE_WAIT_RESULT=true
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20
SUBMISSION_CACHE_DURATION=0

############################
# Worker & Queue
############################

INTERVAL=0.1
COUNT=2
MAX_QUEUE_SIZE=200


############################
# Authentication (Enable in production if public)
############################

# AUTHN_HEADER=X-Auth-Token
# AUTHN_TOKEN=your_secret_token_here

# AUTHZ_HEADER=X-Auth-User
# AUTHZ_TOKEN=your_admin_token_here


############################
# Redis Configuration
############################

REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=tttt2004
# RESQUE_NAMESPACE=prod:resque


############################
# PostgreSQL Configuration
############################

POSTGRES_HOST=postgres
POSTGRES_PORT=5432
POSTGRES_DB=study_db
POSTGRES_USER=study_user
POSTGRES_PASSWORD=tttt2004


############################
# Sandbox Limits (Isolate)
############################

# Default CPU limit (C/C++)
CPU_TIME_LIMIT=2
MAX_CPU_TIME_LIMIT=10

WALL_TIME_LIMIT=12

MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=256000

STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60

MAX_FILE_SIZE=1024

NUMBER_OF_RUNS=1

ENABLE_NETWORK=false


############################
# Rails API
############################

RAILS_ENV=production
RAILS_MAX_THREADS=4
RAILS_SERVER_PROCESSES=1

