################################################################################
# Judge0 Configuration - local 40-Study stack
################################################################################

JUDGE0_TELEMETRY_ENABLE=false
RESTART_MAX_TRIES=10
MAINTENANCE_MODE=false

ENABLE_WAIT_RESULT=true
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20
SUBMISSION_CACHE_DURATION=0

################################################################################
# Worker & Queue
################################################################################

INTERVAL=0.1
COUNT=1
MAX_QUEUE_SIZE=300

################################################################################
# Redis and PostgreSQL
#
# Connection addresses and passwords are passed by docker-compose.yaml. Do not
# duplicate credentials here: this lets Judge0 use the same isolated Redis and
# PostgreSQL services as the rest of 40-Study.
################################################################################

REDIS_HOST=redis
REDIS_PORT=6379
POSTGRES_HOST=postgres
POSTGRES_PORT=5432
POSTGRES_DB=judge0_db

################################################################################
# Sandbox Limits
################################################################################

CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=20
WALL_TIME_LIMIT=20
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=256000
MAX_MEMORY_LIMIT=1536000
STACK_LIMIT=128000
MAX_STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=120
MAX_MAX_PROCESSES_AND_OR_THREADS=120
MAX_FILE_SIZE=2048
NUMBER_OF_RUNS=1
ENABLE_NETWORK=false
DISABLE_CGROUPS=true

################################################################################
# Rails API
################################################################################

RAILS_ENV=production
RAILS_MAX_THREADS=4
RAILS_SERVER_PROCESSES=1
