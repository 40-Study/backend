################################################################################
# Judge0 Configuration - Stable for 4GB RAM (Study Server)
################################################################################

############################
# Server Core
############################

JUDGE0_TELEMETRY_ENABLE=false
RESTART_MAX_TRIES=10
MAINTENANCE_MODE=false

ENABLE_WAIT_RESULT=true
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20
SUBMISSION_CACHE_DURATION=0

############################
# Worker & Queue
############################

INTERVAL=0.1
COUNT=1                 # Giữ 1 worker cho máy 4GB
MAX_QUEUE_SIZE=300

############################
# Redis Configuration
############################

REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=tttt2004

############################
# PostgreSQL Configuration
############################

POSTGRES_HOST=postgres
POSTGRES_PORT=5432
POSTGRES_DB=judge0_db
POSTGRES_USER=study_user
POSTGRES_PASSWORD=tttt2004

############################
# Sandbox Limits (Isolate)
############################

CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=20

WALL_TIME_LIMIT=20
MAX_WALL_TIME_LIMIT=20

# 256MB đủ cho Python/C/Go/Rust; Kotlin/Java cần ~300MB nên dùng override
MEMORY_LIMIT=256000
MAX_MEMORY_LIMIT=1536000          # tsc (TypeScript compiler) cần ~1.5GB virtual AS

STACK_LIMIT=128000               # 128000 KB = ~125MB (Judge0 hard cap)
MAX_STACK_LIMIT=128000

MAX_PROCESSES_AND_OR_THREADS=120
MAX_MAX_PROCESSES_AND_OR_THREADS=120

MAX_FILE_SIZE=2048

NUMBER_OF_RUNS=1
ENABLE_NETWORK=false

# Disable cgroups for cgroups v2 compatibility (Docker Desktop/WSL2)
DISABLE_CGROUPS=true

############################
# Rails API
############################

RAILS_ENV=production
RAILS_MAX_THREADS=4
RAILS_SERVER_PROCESSES=1

